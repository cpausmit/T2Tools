#---------------------------------------------------------------------------------------------------
# Configuration of the T2Tools for the Ceph based MIT Tier-2 storage.
#
# All operations are executed via ssh as 'user' on 'server' where the Ceph filesystem is POSIX
# mounted. The logical name space /cms/... is found under 'root' (root + /cms/store/...).
#---------------------------------------------------------------------------------------------------
[cfg]
user = paus
server = t2dsk0014.cmsaf.mit.edu
root = /ceph/tier2mit/rootfolder
# file transfers for up/down: ssh (scp via server) or xrootd (xrdcp via the xrootd door below)
transfer = ssh
xrootd = root://xrootd.cmsaf.mit.edu/
# recursive removal (rmr) refuses paths with less directory levels (/cms/store/user/paus/x = 5)
minRmrDepth = 5
